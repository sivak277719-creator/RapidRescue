<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Modern To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>
                    <i class="fas fa-tasks"></i>
                    TaskMaster
                </h1>
                <p class="subtitle">Stay organized and productive</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <button id="addBtn" class="add-btn" title="Add task">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div class="input-help">Press Enter or click the + button to add a task</div>
            </section>

            <!-- Filter and Sort Section -->
            <section class="controls-section">
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="all">
                        <i class="fas fa-list"></i> All
                    </button>
                    <button class="filter-btn" data-filter="active">
                        <i class="fas fa-circle"></i> Active
                    </button>
                    <button class="filter-btn" data-filter="completed">
                        <i class="fas fa-check-circle"></i> Completed
                    </button>
                </div>
                <div class="action-group">
                    <button id="clearCompletedBtn" class="action-btn" title="Clear completed tasks">
                        <i class="fas fa-trash"></i> Clear Completed
                    </button>
                </div>
            </section>

            <!-- Statistics -->
            <section class="stats-section">
                <div class="stat-card">
                    <span class="stat-label">Total Tasks</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Remaining</span>
                    <span class="stat-value" id="remainingTasks">0</span>
                </div>
            </section>

            <!-- Task List -->
            <section class="task-list-section">
                <div id="taskList" class="task-list">
                    <!-- Tasks will be rendered here -->
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <h2>No tasks yet!</h2>
                    <p>Start by adding a task above to get organized.</p>
                </div>

                <!-- Loading State (optional) -->
                <div id="loadingState" class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading your tasks...</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>TaskMaster &copy; 2024 | Data saved locally in your browser</p>
            <button id="exportBtn" class="footer-btn" title="Export tasks">
                <i class="fas fa-download"></i> Export
            </button>
            <button id="importBtn" class="footer-btn" title="Import tasks">
                <i class="fas fa-upload"></i> Import
            </button>
            <input type="file" id="importFile" accept=".json" style="display: none;">
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
